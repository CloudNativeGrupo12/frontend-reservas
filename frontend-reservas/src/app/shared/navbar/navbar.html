<header class="navbar">
  <a class="brand" routerLink="/">Reservas</a>
  <nav class="links">
    <a routerLink="/reservas" routerLinkActive="active">Reservas</a>
    <a routerLink="/disponibilidad" routerLinkActive="active">Disponibilidad</a>
    <a routerLink="/notificaciones" routerLinkActive="active">Notificaciones</a>
    <a routerLink="/auditoria" routerLinkActive="active">Auditoría</a>
    <a routerLink="/admin" routerLinkActive="active">Admin RabbitMQ</a>
  </nav>
  <div class="auth">
    @if (loggedIn()) {
      <button class="btn btn-outline" (click)="logout()">Cerrar sesión</button>
    } @else {
      <button class="btn btn-primary" (click)="login()">Iniciar sesión</button>
    }
  </div>
</header>
